services:
  - type: web
    name: crest-and-clove-ecommerce
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "8080"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_NAME
        value: "Crest & Clove"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
